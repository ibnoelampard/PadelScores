<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backup lokal PadelScore</title><body style="font:18px system-ui;max-width:600px;margin:40px auto;padding:20px"><h1>Backup lokal PadelScore</h1><p>Buka halaman ini dari alamat yang sama dengan aplikasi lama (termasuk port localhost). Data tidak dikirim ke server.</p><button id="export">Ekspor data lokal lama</button><p id="status" role="status"></p><script>
document.querySelector('#export').onclick=()=>{try{const text=localStorage.getItem('padelscore-state-v1');if(!text){document.querySelector('#status').textContent='Tidak ada data lokal pada alamat ini.';return;}JSON.parse(text);const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='padelscore-local-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='Backup dibuat. Data lokal tetap tersimpan.';}catch{document.querySelector('#status').textContent='Data tidak dapat dibaca. Jangan hapus penyimpanan browser.';}};
</script></body></html>
